
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            background: linear-gradient(135deg, #0f2027, #1c3d5a, #2a5298);
            background-size: 300% 300%;
            animation: gradientFlow 12s ease infinite;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before, body::after {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            z-index: -1;
            pointer-events: none;
        }

        body::before { background: #00f2ff; top: 10%; left: 10%; }
        body::after { background: #0072ff; bottom: 10%; right: 10%; }

        .screen { display: none; width: 100%; max-width: 420px; padding: 20px; }
        .active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 { margin-bottom: 20px; font-weight: 300; letter-spacing: 2px; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
        }

        input::placeholder { color: rgba(255,255,255,0.5); }

        button {
            display: block;
            margin: 15px auto;
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,114,255,0.4); }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
        }

        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .cell:hover { background: rgba(255, 255, 255, 0.2); }
        .win { background: #00f2ff !important; color: #0f2027; }

        table { width: 100%; margin-top: 20px; border-collapse: collapse; border-radius: 10px; overflow: hidden; }
        th, td { border: 1px solid rgba(255,255,255,0.2); padding: 10px; text-align: center; }
        th { background: rgba(255,255,255,0.1); }

        #popup {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 100;
        }

        #popup.show { opacity: 1; pointer-events: all; }
        .popup-box { background: #1c3d5a; padding: 30px; border-radius: 20px; text-align: center; border: 1px solid #00f2ff; }
    </style>
</head>
<body>

    <div id="home" class="screen active">
        <div class="card">
            <h1>Tic Tac Toe Pro</h1>
            <input id="px" placeholder="Player X Name">
            <input id="po" placeholder="Player O Name">
            <button id="playBtn">Start Match</button>
        </div>
    </div>

    <div id="game" class="screen">
        <div class="top-bar">
            <div id="turnText"></div>
            <div>
                <span id="scoreX">X: 0</span> | 
                <span id="scoreO">O: 0</span>
            </div>
        </div>

        <div id="board" class="board"></div>

        <button id="nextRound" style="display:none;">Next Round</button>
        <button id="nextMatch" style="display:none;">New Match</button>

        <table id="resultsTable">
            <thead>
                <tr><th>Round</th><th>Winner</th></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div id="popup">
        <div class="popup-box">
            <h2 id="popupText"></h2>
            <button id="closePopupBtn">Continue</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const home = document.getElementById("home");
        const game = document.getElementById("game");
        const pxInput = document.getElementById("px");
        const poInput = document.getElementById("po");
        const playBtn = document.getElementById("playBtn");
        const boardEl = document.getElementById("board");
        const turnText = document.getElementById("turnText");
        const scoreXText = document.getElementById("scoreX");
        const scoreOText = document.getElementById("scoreO");
        const nextRoundBtn = document.getElementById("nextRound");
        const nextMatchBtn = document.getElementById("nextMatch");
        const tableBody = document.getElementById("tableBody");
        const popup = document.getElementById("popup");
        const popupText = document.getElementById("popupText");
        const closePopupBtn = document.getElementById("closePopupBtn");

        // Game State
        let board = [];
        let cells = [];
        let current = "X";
        let round = 0;
        let score = { X: 0, O: 0 };
        let playerX = "Player X";
        let playerO = "Player O";
        let isGameOver = false;

        playBtn.onclick = () => {
            playerX = pxInput.value.trim() || "Player X";
            playerO = poInput.value.trim() || "Player O";
            
            home.classList.remove("active");
            game.classList.add("active");
            updateScoreUI();
            startGame();
        };

        function startGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            cells = [];
            current = "X";
            isGameOver = false;
            turnText.innerText = `${playerX}'s Turn`;
            boardEl.innerHTML = "";
            nextRoundBtn.style.display = "none";

            for (let i = 0; i < 9; i++) {
                let cell = document.createElement("div");
                cell.className = "cell";
                cell.onclick = () => move(cell, i);
                boardEl.appendChild(cell);
                cells.push(cell);
            }
        }

        function move(cell, i) {
            if (board[i] || isGameOver) return;

            board[i] = current;
            cell.innerText = current;
            cell.style.cursor = "default";

            if (checkWin()) {
                isGameOver = true;
                score[current]++;
                updateScoreUI();
                const winnerName = current === "X" ? playerX : playerO;
                addResultToTable(winnerName);
                celebrate();
                showPopup(`👑 ${winnerName} Wins Round!`);
                handleRoundEnd();
                return;
            }

            if (!board.includes("")) {
                isGameOver = true;
                addResultToTable("Draw");
                showPopup("It's a Draw!");
                handleRoundEnd();
                return;
            }

            current = current === "X" ? "O" : "X";
            turnText.innerText = `${current === "X" ? playerX : playerO}'s Turn`;
        }

        function checkWin() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return wins.some(comb => {
                if (comb.every(i => board[i] === current)) {
                    comb.forEach(i => cells[i].classList.add("win"));
                    return true;
                }
                return false;
            });
        }

        function updateScoreUI() {
            scoreXText.innerText = `${playerX}: ${score.X}`;
            scoreOText.innerText = `${playerO}: ${score.O}`;
        }

        function addResultToTable(winner) {
            round++;
            const row = tableBody.insertRow();
            const cell1 = row.insertCell(0);
            const cell2 = row.insertCell(1);
            cell1.textContent = round;
            cell2.textContent = winner;
        }

        function handleRoundEnd() {
            if (round >= 5) {
                nextMatchBtn.style.display = "block";
                const finalMsg = score.X > score.O ? `🏆 ${playerX} WINS THE MATCH!` : 
                               score.O > score.X ? `🏆 ${playerO} WINS THE MATCH!` : "Match Draw!";
                setTimeout(() => showPopup(finalMsg), 500);
            } else {
                nextRoundBtn.style.display = "block";
            }
        }

        nextRoundBtn.onclick = startGame;
        nextMatchBtn.onclick = () => location.reload();
        closePopupBtn.onclick = () => popup.classList.remove("show");

        function showPopup(msg) {
            popupText.innerText = msg;
            popup.classList.add("show");
        }

        function celebrate() {
            for (let i = 0; i < 50; i++) {
                const c = document.createElement("div");
                const size = Math.random() * 8 + 5;
                c.style.cssText = `
                    position:fixed; width:${size}px; height:${size}px;
                    background:hsl(${Math.random()*360},100%,50%);
                    left:${Math.random()*100}vw; top:-20px; z-index:1000; pointer-events:none;
                `;
                document.body.appendChild(c);

                const speed = Math.random() * 3 + 3;
                let top = -20;
                const fall = setInterval(() => {
                    top += speed;
                    c.style.top = top + "px";
                    if (top > window.innerHeight) {
                        clearInterval(fall);
                        c.remove();
                    }
                }, 20);
            }
        }
    </script>
</body>
  </html>
